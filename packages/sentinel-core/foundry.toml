[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["safe/=lib/safe-smart-account/contracts/"]

# Safe v1.4.1 does not compile under via_ir (stack too deep in execTransaction), so it and the tests that
# deploy it use the legacy pipeline. Everything else keeps via_ir.
additional_compiler_profiles = [{ name = "legacy", via_ir = false }]
compilation_restrictions = [{ paths = "lib/safe-smart-account/**", via_ir = false }]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = true
fs_permissions = [{ access = "read", path = "./"}]

# Testing
fuzz = { runs = 256, max_test_rejects = 65536 }
invariant = { runs = 256, depth = 15 }

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 500, depth = 20 }

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"
